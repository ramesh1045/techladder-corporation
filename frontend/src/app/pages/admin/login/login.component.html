<div class="login-shell">
  <div class="login-card">
    <div class="brand">Tech<span>Ladder</span></div>
    <p class="subtitle">Admin Access</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" autocomplete="username" />
        @if (form.get('email')?.invalid && form.get('email')?.touched) {
          <span class="error">Enter a valid email</span>
        }
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" autocomplete="current-password" />
        @if (form.get('password')?.invalid && form.get('password')?.touched) {
          <span class="error">Password is required</span>
        }
      </div>

      @if (errorMsg()) { <p class="form-error">{{ errorMsg() }}</p> }

      <button type="submit" class="btn-login" [disabled]="submitting()">
        {{ submitting() ? 'Signing in...' : 'Login' }}
      </button>
    </form>
  </div>
</div>
